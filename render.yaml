services:
  - type: web
    name: property-agent-mini
    runtime: python
    plan: free
    buildCommand: ""
    startCommand: python3 server.py
    healthCheckPath: /
    envVars:
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SITE_URL
        value: https://property-agent-mini.onrender.com
