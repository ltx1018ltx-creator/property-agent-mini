services:
  - type: web
    name: property-agent-mini
    runtime: python
    plan: free
    buildCommand: ""
    startCommand: python3 server.py
    healthCheckPath: /
    envVars:
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: WHATSAPP_ALLOWED_CONVERSATION_KEY
        sync: false
      - key: SITE_URL
        value: https://property-agent-mini.onrender.com
      - key: AI_DRAFT_ENABLED
        value: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
  - type: web
    name: tong-xen-property
    runtime: python
    plan: free
    buildCommand: ""
    startCommand: python3 server.py
    healthCheckPath: /landing.html
    envVars:
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SITE_URL
        value: https://tong-xen-property.onrender.com
      - key: AI_DRAFT_ENABLED
        value: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
