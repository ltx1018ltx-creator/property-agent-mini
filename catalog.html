<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6f4030">
  <title>Tong Xen · Property Listings</title>
  <link rel="stylesheet" href="catalog.css?v=5">
</head>
<body>
  <header class="catalog-head">
    <nav><a class="brand" href="#list" aria-label="Tong Xen property listings"><span>TX</span><b>Tong Xen<small>REN 51905</small></b></a><a class="head-contact" href="https://wa.me/60166286918">WhatsApp</a></nav>
    <div class="hero-copy"><small>MELAKA PROPERTY COLLECTION</small><h1>Find a place<br>that feels right.</h1><p>Browse my latest listings, save your favourites and enquire in one WhatsApp message.</p></div>
  </header>
  <main>
    <div class="toolbar-wrap">
      <div class="toolbar"><label class="search-box"><span>⌕</span><input id="search" type="search" placeholder="Search location or property type…"></label><button id="filterBtn" aria-expanded="false">Filters <b id="filterBadge" class="hidden">0</b></button></div>
      <div id="filterPanel" class="filter-panel hidden">
        <div class="filter-grid">
          <label>Deal <small>Select one or more</small><select id="dealFilter" multiple size="2"><option value="sale">For Sale</option><option value="rent">For Rent</option></select></label>
          <label>Location <small>Select one or more</small><select id="locationFilter" multiple size="4"></select></label>
          <label>Property type <small>Select one or more</small><select id="typeFilter" multiple size="4"></select></label>
          <label>Subtype <small>Select one or more</small><select id="subtypeFilter" multiple size="4"></select></label>
          <label>Tenure <small>Select one or more</small><select id="tenureFilter" multiple size="2"><option>Freehold</option><option>Leasehold</option></select></label>
          <label>Price <small>Select one or more</small><select id="priceFilter" multiple size="4"></select></label>
        </div>
        <button id="clearFilters">Clear all filters</button>
      </div>
      <div class="result-line"><h2>Available properties</h2><span id="count">Loading listings…</span></div>
    </div>
    <section id="list" class="catalog-grid"></section>
  </main>
  <div id="selectionBar" class="selection-bar hidden">
    <div><b><span id="selectedCount">0</span> selected</b><small>Send all in one enquiry</small></div>
    <button id="clearBtn" aria-label="Clear selection">Clear</button><button id="whatsappBtn">WhatsApp now</button>
  </div>
  <dialog id="detailDialog"><div id="detail"></div></dialog>
  <script src="supabase.js?v=2"></script>
  <script src="catalog.js?v=13"></script>
</body>
</html>
